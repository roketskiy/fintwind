[env]
# Xcode ships the Metal compiler as an optional toolchain. GPUI's build script
# invokes `xcrun metal`, so select that toolchain for precompiled shaders.
TOOLCHAINS = "Metal"
# JSON has no bigint literal, so generated browser bindings model the wire's
# integer fields as JavaScript numbers.
TS_RS_LARGE_INT = "number"

# Link the C runtime statically on Windows, as Zed does for GPUI. The
# alternative is shipping (or installing) the Visual C++ redistributable, and
# neither works here: Fintwind installs per-user with no elevation precisely so it
# can update itself silently, and the portable zip has to run from wherever it
# is unpacked. Windows on Arm makes the failure routine rather than rare — an
# arm64 machine almost never has the arm64 redistributable already, so a
# dynamically linked build dies at startup on `VCRUNTIME140.dll`.
#
# Link with rust-lld, shipped inside the rustc sysroot, as Zed does for its
# Windows GPUI builds: linking is the slowest step of a Fintwind build and lld
# is markedly faster than MSVC link.exe. rustc selects lld's MSVC flavor
# automatically, and lld-link accepts the `/stack` argument from build.rs.
#
# History: this used to be the default link.exe because a custom linker made
# every rustc invocation uncacheable for mbx, the local Cargo build cache, so
# worktrees could not reuse work. mbx is not in use now; if it returns,
# re-evaluate this trade-off.
[target.'cfg(target_os = "windows")']
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[build]
jobs = 4
