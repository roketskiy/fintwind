name: Set up Rust and caches
description: Shared toolchain, dependency downloads, and bounded-profile build caches
inputs:
  kind:
    description: Separate cache namespace (test, release-check, release-build)
    required: true
  profile:
    description: Cargo output profile directory (debug or release)
    required: true
outputs:
  build-key:
    description: Content-addressed build key to save after input verification
    value: ${{ steps.build.outputs.cache-primary-key }}
  build-hit:
    description: Whether the exact build cache already exists
    value: ${{ steps.build.outputs.cache-hit }}
  build-path:
    description: Only compiler artifacts, not incremental state or distributable bundles
    value: |
      target/${{ inputs.profile }}/deps
      target/${{ inputs.profile }}/build
      target/${{ inputs.profile }}/.fingerprint
      target/${{ inputs.profile }}/examples
runs:
  using: composite
  steps:
    - name: Initialize the native MSVC and SDK environment
      shell: pwsh
      env:
        CARGO_CACHE_NATIVE_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      run: |
        python scripts/cargo-cache-msvc.py --arch $env:CARGO_CACHE_NATIVE_ARCH
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install Rust
      shell: pwsh
      run: |
        $version = (Get-Content '.github/rust-version' -Raw).Trim()
        rustup toolchain install $version --profile minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        rustup default $version

    - name: Cache dependency downloads
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          ~/.cargo/git/db
          ~/.cargo/git/checkouts
        key: cargo-downloads-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v3-${{ runner.os }}-${{ runner.arch }}-

    - name: Identify the complete workspace build inputs
      id: inputs
      shell: pwsh
      env:
        CARGO_CACHE_PROFILE: ${{ inputs.profile }}
        CARGO_CACHE_KIND: ${{ inputs.kind }}
      run: |
        python scripts/cargo-cache-workspace.py prepare --profile $env:CARGO_CACHE_PROFILE --kind $env:CARGO_CACHE_KIND --report (Join-Path (Join-Path $env:RUNNER_TEMP ('cargo-cache-' + $env:CARGO_CACHE_KIND)) 'source-inputs-prepare.json')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Restore compiler artifacts
      id: build
      uses: actions/cache/restore@v6
      with:
        path: |
          target/${{ inputs.profile }}/deps
          target/${{ inputs.profile }}/build
          target/${{ inputs.profile }}/.fingerprint
          target/${{ inputs.profile }}/examples
        key: cargo-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.kind }}-${{ steps.inputs.outputs.compatibility-hash }}-${{ steps.inputs.outputs.input-hash }}
        restore-keys: |
          cargo-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.kind }}-${{ steps.inputs.outputs.compatibility-hash }}-

    - name: Restore content-verified workspace input timestamps
      shell: pwsh
      env:
        CARGO_CACHE_PROFILE: ${{ inputs.profile }}
        CARGO_CACHE_KIND: ${{ inputs.kind }}
      run: |
        python scripts/cargo-cache-workspace.py restore --profile $env:CARGO_CACHE_PROFILE --kind $env:CARGO_CACHE_KIND --report (Join-Path (Join-Path $env:RUNNER_TEMP ('cargo-cache-' + $env:CARGO_CACHE_KIND)) 'source-inputs-restore.json')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Capture before compilation, so build-time source edits cannot acquire
    # trusted timestamps. The snapshot lives inside the cached .fingerprint.
    - name: Capture inputs before compilation
      shell: pwsh
      env:
        CARGO_CACHE_PROFILE: ${{ inputs.profile }}
        CARGO_CACHE_KIND: ${{ inputs.kind }}
      run: |
        python scripts/cargo-cache-workspace.py capture --profile $env:CARGO_CACHE_PROFILE --kind $env:CARGO_CACHE_KIND --report (Join-Path (Join-Path $env:RUNNER_TEMP ('cargo-cache-' + $env:CARGO_CACHE_KIND)) 'source-inputs-capture.json')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
