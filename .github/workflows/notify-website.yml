name: Notify website on release

on:
  release:
    types: [published]

jobs:
  dispatch:
    # 落地页只同步正式版；prerelease 不触发
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website sync
        run: |
          version="${{ github.event.release.tag_name }}"
          payload=$(jq -n --arg v "$version" '{event_type: "release-published", client_payload: {version: $v}}')
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_RELEASE_PAT }}" \
            "https://api.github.com/repos/${{ github.repository_owner }}/fintwind-website/dispatches" \
            -d "$payload"
