name: Notify website on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing full release tag to synchronize (for example v0.2.18)
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    # 落地页只同步正式版；prerelease 不触发
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Trigger website sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEBSITE_RELEASE_PAT: ${{ secrets.WEBSITE_RELEASE_PAT }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bun scripts/release-ci.ts website
