name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Validate version, notes, and existing release
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/release-ci.ts prepare

  checks:
    name: Require same-commit Tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Wait for existing Tests, without triggering another run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/release-ci.ts checks

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: fintwind-go/go.mod
          cache-dependency-path: fintwind-go/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Bundle
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # CI publishes the stable channel only; beta is a local build.
          FINTWIND_CHANNEL: stable
        run: bun scripts/bundle-windows.ts --channel=stable

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            target/release/fintwind-${{ needs.version.outputs.version }}-${{ matrix.target }}.zip
            target/release/fintwind-${{ needs.version.outputs.version }}-${{ matrix.arch }}-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft-release:
    name: Draft GitHub release
    needs: [version, checks, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the version pointer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "$VERSION" > artifacts/latest-windows.txt

      - name: Revalidate release immediately before updating the draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release-ci.ts checks
          bun scripts/release-ci.ts prepare

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          # A manual run has no tag yet; publishing the draft creates this one
          # at the commit that was built.
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/latest-windows.txt
