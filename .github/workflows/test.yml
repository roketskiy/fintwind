name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-latest-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-latest-rust-1.96.0-cargo-

      - name: Run tests
        run: cargo test --locked

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check generated protocol and browser client
        run: |
          bun run protocol:check
          bun run --filter @fintwind/client check
          bun run --filter @fintwind/client test
