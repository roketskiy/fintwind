name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build and vet
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fintwind-go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: fintwind-go/go.mod
          cache-dependency-path: fintwind-go/go.sum
      - name: Build
        run: go build -mod=readonly ./...
      - name: Vet
        run: go vet -mod=readonly ./internal/... ./cmd/app ./cmd/daemon ./cmd/mygo
      - name: Check MyGo UI lifetimes
        run: go run -mod=readonly github.com/egoist/mygo/cmd/mygo vet ./cmd/app
