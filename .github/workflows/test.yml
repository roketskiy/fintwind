name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-latest-rust-1.97.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-latest-rust-1.97.0-cargo-

      - name: Run tests
        run: cargo test --locked

  # Debug tests never compile the release-only channel code, so this job
  # checks the stable release configuration that CI actually ships. Beta is
  # a local-only channel and is never built or checked on GitHub. Check
  # only — running tests stays the debug job above's.
  stable-release:
    name: Stable release compile check
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-latest-rust-1.97.0-release-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-latest-rust-1.97.0-release-check-

      - name: Check stable release
        run: cargo check --locked --release --package fintwind --bin fintwind --package fintwind-daemon --bin fintwind-daemon
