name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    name: Rust (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust and caches
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          kind: test
          profile: debug

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify Cargo cache freshness offline
        timeout-minutes: 3
        run: python scripts/cargo-cache-diagnostics-blackbox.py --sysroot (rustc --print sysroot) --output (Join-Path $env:RUNNER_TEMP 'cargo-cache-freshness/result.json')

      - name: Upload cache freshness verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-cache-freshness-report
          path: ${{ runner.temp }}/cargo-cache-freshness/result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run tests
        run: ./scripts/cargo-cache-diagnostics.ps1 -Mode Test -LogDirectory (Join-Path $env:RUNNER_TEMP 'cargo-cache-test')

      - name: Upload Cargo cache diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-cache-diagnostics-test
          path: ${{ runner.temp }}/cargo-cache-test/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-diagnostics
          path: temp/recovery-e2e/**/result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Save compiler artifacts
        if: success() && github.ref == 'refs/heads/main' && steps.rust.outputs.build-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust.outputs.build-key }}
          path: ${{ steps.rust.outputs.build-path }}

  # Debug tests never compile the release-only channel code, so this job
  # checks the stable release configuration that CI actually ships. Beta is
  # a local-only channel and is never built or checked on GitHub. Check
  # only — running tests stays the debug job above's.
  stable-release:
    name: Stable release compile check
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust and caches
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          kind: release-check
          profile: release

      - name: Check stable release
        run: ./scripts/cargo-cache-diagnostics.ps1 -Mode StableRelease -LogDirectory (Join-Path $env:RUNNER_TEMP 'cargo-cache-release-check')

      - name: Upload Cargo cache diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-cache-diagnostics-release-check
          path: ${{ runner.temp }}/cargo-cache-release-check/
          if-no-files-found: warn
          retention-days: 7

      - name: Save compiler artifacts
        if: success() && github.ref == 'refs/heads/main' && steps.rust.outputs.build-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust.outputs.build-key }}
          path: ${{ steps.rust.outputs.build-path }}

  workflow-tools:
    name: Workflow tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Check release automation against an isolated API
        run: python3 scripts/ci-workflows-blackbox.py --output "$RUNNER_TEMP/workflow-tools/result.json"
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-tools-report
          path: ${{ runner.temp }}/workflow-tools/result.json
          retention-days: 7
