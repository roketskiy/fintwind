[package]
name = "fintwind"
version = "0.3.4"
edition = "2024"
# std `try_update` requires 1.100; CI pins the same toolchain.
rust-version = "1.100"
description = "A native Windows desktop app for OpenCode"
license = "GPL-3.0-only"

[[bin]]
name = "fintwind"
path = "src/main.rs"

[features]
# Local beta channel; uses production data but skips automatic updates.
beta = []

[workspace]
members = [
    "crates/fintwind-client",
    "crates/fintwind-daemon",
    "crates/fintwind-diagram",
    "crates/fintwind-diff",
    "crates/fintwind-driver",
    "crates/fintwind-env",
    "crates/fintwind-git",
    "crates/fintwind-http",
    "crates/fintwind-input",
    "crates/fintwind-integrations-ui",
    "crates/fintwind-markdown",
    "crates/fintwind-opencode-config",
    "crates/fintwind-preview-ui",
    "crates/fintwind-protocol",
    "crates/fintwind-providers-ui",
    "crates/fintwind-quota",
    "crates/fintwind-remote",
    "crates/fintwind-scheduled",
    "crates/fintwind-scheduled-ui",
    "crates/fintwind-scm-ui",
    "crates/fintwind-ssh-probe",
    "crates/fintwind-ssh-ui",
    "crates/fintwind-storage",
    "crates/fintwind-terminal-ui",
    "crates/fintwind-ui",
    "crates/fintwind-usage-ui",
    "crates/fintwind-workspace",
]
default-members = [
    ".",
    "crates/fintwind-client",
    "crates/fintwind-daemon",
    "crates/fintwind-diagram",
    "crates/fintwind-diff",
    "crates/fintwind-driver",
    "crates/fintwind-env",
    "crates/fintwind-git",
    "crates/fintwind-http",
    "crates/fintwind-input",
    "crates/fintwind-integrations-ui",
    "crates/fintwind-markdown",
    "crates/fintwind-opencode-config",
    "crates/fintwind-preview-ui",
    "crates/fintwind-protocol",
    "crates/fintwind-providers-ui",
    "crates/fintwind-quota",
    "crates/fintwind-remote",
    "crates/fintwind-scheduled",
    "crates/fintwind-scheduled-ui",
    "crates/fintwind-scm-ui",
    "crates/fintwind-ssh-ui",
    "crates/fintwind-storage",
    "crates/fintwind-terminal-ui",
    "crates/fintwind-ui",
    "crates/fintwind-usage-ui",
    "crates/fintwind-workspace",
]
resolver = "2"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "6.0"
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# The GPUI crates.io snapshot family (`gpui-pre` = zed@279fe07), shared with
# gpui-kit 0.7.1.
gpui = { package = "gpui-pre", version = "=0.3.8" }
# Longbridge's component library. Re-exports the same gpui-pre types, so no
# adapter layer is needed between Fintwind code and kit components.
gpui-kit = "0.7.1"
# Ely's components, pinned to the main-branch revision reviewed at adoption.
# It shares this project's gpui-pre =0.3.8 / gpui-pre-platform =0.3.8, so the
# `[patch.crates-io]` overlay below applies to its GPUI too — one type system,
# no second gpui. `runtime_shaders` (its default) only reaches the macOS
# platform backend, so it stays off.
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "bd014707fd47cd9d0651a9af8c1db6033718a6ea", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "font-kit",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-client = { path = "crates/fintwind-client", features = ["ssh"] }
fintwind-diagram = { path = "crates/fintwind-diagram" }
fintwind-diff = { path = "crates/fintwind-diff" }
fintwind-env = { path = "crates/fintwind-env" }
fintwind-git = { path = "crates/fintwind-git" }
fintwind-http = { path = "crates/fintwind-http" }
fintwind-input = { path = "crates/fintwind-input" }
fintwind-integrations-ui = { path = "crates/fintwind-integrations-ui" }
fintwind-markdown = { path = "crates/fintwind-markdown" }
fintwind-opencode-config = { path = "crates/fintwind-opencode-config" }
fintwind-preview-ui = { path = "crates/fintwind-preview-ui" }
fintwind-protocol = { path = "crates/fintwind-protocol" }
fintwind-providers-ui = { path = "crates/fintwind-providers-ui" }
fintwind-quota = { path = "crates/fintwind-quota" }
fintwind-remote = { path = "crates/fintwind-remote" }
fintwind-scheduled-ui = { path = "crates/fintwind-scheduled-ui" }
fintwind-scm-ui = { path = "crates/fintwind-scm-ui" }
fintwind-ssh-ui = { path = "crates/fintwind-ssh-ui" }
fintwind-terminal-ui = { path = "crates/fintwind-terminal-ui" }
fintwind-ui = { path = "crates/fintwind-ui" }
fintwind-usage-ui = { path = "crates/fintwind-usage-ui" }
regex = "1"
qrcode = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-i18n = "4"
# Verifies a downloaded update installer against the digest GitHub publishes
# with the release asset, so an update never runs something the API did not
# attest to. Already in the graph through fintwind-http / fintwind-protocol.
sha2 = "0.10"
smol = "2"
futures-lite = "2"
nucleo-matcher = "0.3.1"

# `test-support` has to stay test-only. It compiles a loop into gpui's
# `flush_effects` that draws every dirty window right there, so with the
# feature on a shipping build every notify pays a full frame the moment it
# happens instead of coalescing into the display link's next one — a panel
# resize drew once per mouse-move event rather than once per displayed frame.
[dev-dependencies]
fintwind-ssh-ui = { path = "crates/fintwind-ssh-ui", features = ["e2e-deploy"] }
gpui = { package = "gpui-pre", version = "=0.3.8", features = [
    "test-support",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
# GPUI does not read the Windows animation preference, so Fintwind asks
# `SystemParametersInfoW` itself. `windows-sys` numbers its releases
# independently of `windows` and carries plain Win32 FFI.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimize debug builds aggressively for compile speed and minimal artifact size:
# keep workspace crates at opt-level = 0 for fast incremental checks/builds,
# use lightweight opt-level = 1 for dependencies to prevent multi-GB .rlib
# bloat while staying much faster than opt-level = 2, omit debuginfo/PDBs,
# strip symbol tables, and disable overflow checks while preserving
# debug_assertions (Dev channel identity) and incremental compilation.
[profile.dev]
opt-level = 0
debug = 0
strip = "symbols"
overflow-checks = false

[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 0
debug = 0
strip = "debuginfo"

# Prevent test binaries from accumulating per-target incremental caches.
[profile.test]
incremental = false

# `block` 0.1.6 declares an extern static with an uninhabited type. This fork
# is the crates.io release plus the future-incompatibility fix only.
[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
# The gpui-pre 0.3.8 snapshot plus zed PR #61945 (layered scene rendering:
# `enable_scene_overlay`, `create_native_surface`, `PlatformNativeSurface`,
# `Scene::is_empty`, the DirectComposition portal visual tree). The published
# snapshot does not carry the overlay API. gpui-pre-windows must be patched together with gpui-pre:
# the Windows renderer hosts the overlay swap chain and the portal.
gpui-pre = { path = "vendor/gpui-pre/gpui-pre-0.3.8" }
gpui-pre-windows = { path = "vendor/gpui-pre/gpui-pre-windows-0.3.8" }
