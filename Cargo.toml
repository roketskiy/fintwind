[package]
name = "waku"
version = "0.1.0"
edition = "2024"
description = "A fast, native control plane for local coding agents"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "6.0"
# GPUI's native Metal renderer is the macOS default. Enabling `macos-blade`
# replaces it with BladeRenderer.
gpui = "0.2.2"
gpui-component = { path = "vendor/gpui-component" }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSAppearance",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug assertions and incremental builds for app code, but do not run
# GPUI's text shaping and Taffy layout hot paths completely unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
