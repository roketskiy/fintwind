[package]
name = "fintwind"
version = "2.0.12"
edition = "2024"
# Ondine (crates/fintwind-diagram) requires 1.97; CI pins the same toolchain.
rust-version = "1.97"
description = "A native Windows desktop app for OpenCode"
license = "GPL-3.0-only"

[[bin]]
name = "fintwind"
path = "src/main.rs"

[features]
# Developer-only WebView2 / Playwright validation; never enabled by default.
browser-poc = ["windows-sys/Win32_System_Registry"]
# Local beta channel; uses production data but skips automatic updates.
beta = []

[workspace]
members = [
    "crates/fintwind-client",
    "crates/fintwind-core",
    "crates/fintwind-daemon",
    "crates/fintwind-diagram",
    "crates/fintwind-protocol",
]
default-members = [
    ".",
    "crates/fintwind-client",
    "crates/fintwind-core",
    "crates/fintwind-daemon",
    "crates/fintwind-diagram",
    "crates/fintwind-protocol",
]
resolver = "2"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "6.0"
# The GPUI crates.io snapshot family (`gpui-pre` = zed@279fe07), shared with
# gpui-kit 0.7.1. The `vendor/gpui-pre` copies are patched with zed PR #61945
# (layered scene rendering) so GPUI menus, tooltips and popovers keep drawing
# above the browser surface's WebView2 composition visual — the snapshot has no
# such API, and the old git fork's types are incompatible with gpui-kit.
gpui = { package = "gpui-pre", version = "=0.3.8" }
# Longbridge's component library. Re-exports the same gpui-pre types, so no
# adapter layer is needed between Fintwind code and kit components.
gpui-kit = "0.7.1"
# Ely's components, pinned to the main-branch revision reviewed at adoption.
# It shares this project's gpui-pre =0.3.8 / gpui-pre-platform =0.3.8, so the
# `[patch.crates-io]` overlay below applies to its GPUI too — one type system,
# no second gpui. `runtime_shaders` (its default) only reaches the macOS
# platform backend, so it stays off.
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "bd014707fd47cd9d0651a9af8c1db6033718a6ea", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "font-kit",
] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
unicode-linebreak = "0.1.5"
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-client = { path = "crates/fintwind-client" }
fintwind-diagram = { path = "crates/fintwind-diagram" }
fintwind-protocol = { path = "crates/fintwind-protocol" }
pulldown-cmark = "0.13"
# Native, offline math typesetting; all layout and raster work runs on workers.
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-i18n = "4"
# Verifies a downloaded update installer against the digest GitHub publishes
# with the release asset, so an update never runs something the API did not
# attest to. Already in the graph through fintwind-core.
sha2 = "0.10"
smol = "2"
ropey = "=2.0.0-beta.1"
futures-lite = "2"
futures = "0.3"
nucleo-matcher = "0.3.1"

# `test-support` has to stay test-only. It compiles a loop into gpui's
# `flush_effects` that draws every dirty window right there, so with the
# feature on a shipping build every notify pays a full frame the moment it
# happens instead of coalescing into the display link's next one — a panel
# resize drew once per mouse-move event rather than once per displayed frame.
[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = [
    "test-support",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
# The browser surface. WebView2 is evergreen on Windows 10 and in-box on 11.
# Fintwind drives it through `webview2-com` rather than wry because it needs the
# *composition* controller, which renders into a DirectComposition visual
# instead of a child HWND — see `browser::host` for why, and note that only
# the environment can create one, so it cannot be reached from wry's
# `WebViewExtWindows` after the fact. 0.39 is the first release built against
# `windows` 0.62, matching gpui-pre 0.3.8, so the portal's `IDCompositionVisual`
# hands to `SetRootVisualTarget` with one shared type system.
webview2-com = "0.39"
# Same version gpui-pre is built against, so the portal's `IDCompositionVisual`
# hands straight to `SetRootVisualTarget` with no ABI bridging. `windows-sys`
# stays for the plain Win32 calls that do not need COM.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
# GPUI does not read the Windows animation preference, so Fintwind asks
# `SystemParametersInfoW` itself. `windows-sys` numbers its releases
# independently of `windows`; 0.61 is the newest line at the time of this
# migration and only carries plain Win32 FFI, so it shares nothing with the
# COM types above.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug assertions and incremental builds for app code, but do not run
# GPUI's text shaping and Taffy layout hot paths completely unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `block` 0.1.6 declares an extern static with an uninhabited type. This fork
# is the crates.io release plus the future-incompatibility fix only.
[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
# The gpui-pre 0.3.8 snapshot plus zed PR #61945 (layered scene rendering:
# `enable_scene_overlay`, `create_native_surface`, `PlatformNativeSurface`,
# `Scene::is_empty`, the DirectComposition portal visual tree). The published
# snapshot does not carry the overlay API, and Fintwind's browser surface
# depends on it. gpui-pre-windows must be patched together with gpui-pre:
# the Windows renderer hosts the overlay swap chain and the portal.
gpui-pre = { path = "vendor/gpui-pre/gpui-pre-0.3.8" }
gpui-pre-windows = { path = "vendor/gpui-pre/gpui-pre-windows-0.3.8" }
