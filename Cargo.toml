[package]
name = "fintwind"
version = "0.1.7"
edition = "2024"
description = "A native Windows desktop app for OpenCode 2"
license = "GPL-3.0-only"

[[bin]]
name = "fintwind"
path = "src/main.rs"

[workspace]
members = [
    "crates/fintwind-client",
    "crates/fintwind-core",
    "crates/fintwind-daemon",
    "crates/fintwind-protocol",
]
default-members = [
    ".",
    "crates/fintwind-client",
    "crates/fintwind-core",
    "crates/fintwind-daemon",
    "crates/fintwind-protocol",
]
resolver = "2"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "6.0"
# The egoist/zed fork is upstream main plus PR #61945 (layered scene
# rendering), which lets GPUI composite menus and tooltips above native child
# views — the browser surface's WebView2. Drop back to upstream once the PR
# merges.
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview" }
gpui_platform = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
    "font-kit",
] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-client = { path = "crates/fintwind-client" }
fintwind-protocol = { path = "crates/fintwind-protocol" }
pulldown-cmark = "0.13"
# Inline math renders as Unicode text; display math rasterizes on a background
# thread through the RaTeX family (KaTeX-compatible, fonts embedded in-binary).
unicodeit = "0.2"
ratex-parser = "0.1"
ratex-layout = "0.1"
ratex-types = "0.1"
ratex-render = { version = "0.1", features = ["embed-fonts"] }
regex = "1"
rust-i18n = "4"
rust-umami = "0.1.1"
smol = "2"
ropey = "=2.0.0-beta.1"
futures-lite = "2"
futures = "0.3"
nucleo-matcher = "0.3.1"
tokio = { version = "1", features = ["rt"] }

# `test-support` has to stay test-only. It compiles a loop into gpui's
# `flush_effects` that draws every dirty window right there, so with the
# feature on a shipping build every notify pays a full frame the moment it
# happens instead of coalescing into the display link's next one — a panel
# resize drew once per mouse-move event rather than once per displayed frame.
[dev-dependencies]
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
    "test-support",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
# The browser surface. WebView2 is evergreen on Windows 10 and in-box on 11.
# Fintwind drives it through `webview2-com` rather than wry because it needs the
# *composition* controller, which renders into a DirectComposition visual
# instead of a child HWND — see `browser::host` for why, and note that only
# the environment can create one, so it cannot be reached from wry's
# `WebViewExtWindows` after the fact.
webview2-com = "0.38"
# Same version GPUI is built against, so the portal's `IDCompositionVisual`
# hands straight to `SetRootVisualTarget` with no ABI bridging. `windows-sys`
# stays for the plain Win32 calls that do not need COM.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
# GPUI does not read the Windows animation preference, so Fintwind asks
# `SystemParametersInfoW` itself. Same major version as the one already in the
# graph through GPUI.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Verifies the EdDSA signatures `scripts/appcast-windows.ts` writes.
ed25519-dalek = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug assertions and incremental builds for app code, but do not run
# GPUI's text shaping and Taffy layout hot paths completely unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `block` 0.1.6 declares an extern static with an uninhabited type. This fork
# is the crates.io release plus the future-incompatibility fix only.
[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
