[package]
name = "fintwind-client"
version = "0.1.0"
edition = "2024"
description = "Rust client and daemon process supervisor for Fintwind"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
crossbeam-channel = "0.5"
dirs = "6.0"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
parking_lot = "0.12"
nucleo-matcher = "0.3"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smol = "2"
tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "rustls-tls-native-roots",
] }
url = "2"
unicode-width = "0.2.2"
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-protocol = { path = "../fintwind-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
