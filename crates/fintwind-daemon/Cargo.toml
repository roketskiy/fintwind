[package]
name = "fintwind-daemon"
version = "0.1.0"
edition = "2024"
description = "Headless Fintwind provider daemon"
license = "GPL-3.0-only"
readme = "README.md"

[features]
dev-binary = []

[[bin]]
name = "fintwind-daemon"
path = "src/main.rs"

[[bin]]
name = "fintwind-debug-daemon"
path = "src/bin/fintwind-debug-daemon.rs"
required-features = ["dev-binary"]

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
subtle = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-driver = { path = "../fintwind-driver" }
fintwind-env = { path = "../fintwind-env" }
fintwind-git = { path = "../fintwind-git" }
fintwind-http = { path = "../fintwind-http" }
fintwind-opencode-config = { path = "../fintwind-opencode-config" }
fintwind-protocol = { path = "../fintwind-protocol" }
fintwind-quota = { path = "../fintwind-quota" }
fintwind-scheduled = { path = "../fintwind-scheduled" }
fintwind-storage = { path = "../fintwind-storage" }
fintwind-workspace = { path = "../fintwind-workspace" }

[dev-dependencies]
base64 = "0.22"
chrono = "0.4"
fintwind-client = { path = "../fintwind-client" }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
