[package]
name = "fintwind-markdown"
version = "0.1.0"
edition = "2024"
description = "Markdown parsing, syntax highlighting, LaTeX math, Mermaid diagrams, and mention/privacy rendering"
license = "GPL-3.0-only"

[dependencies]
aho-corasick = "1"
anyhow = "1.0"
base64 = "0.22"
dirs = "6.0"
fancy-regex = "0.14"
gpui = { package = "gpui-pre", version = "=0.3.8" }
image = { version = "0.25", default-features = false, features = ["png"] }
parking_lot = "0.12"
pulldown-cmark = "0.13"
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
regex = "1"
serde_json = "1.0"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12"
url = "2"
usvg = "=0.46.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-diagram = { path = "../fintwind-diagram" }
fintwind-protocol = { path = "../fintwind-protocol" }
fintwind-ui = { path = "../fintwind-ui" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
