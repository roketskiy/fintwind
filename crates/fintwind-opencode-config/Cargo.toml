[package]
name = "fintwind-opencode-config"
version = "0.1.0"
edition = "2024"
description = "OpenCode configuration, custom providers, and models.dev catalog"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-env = { path = "../fintwind-env" }
fintwind-http = { path = "../fintwind-http" }
fintwind-protocol = { path = "../fintwind-protocol" }
