[package]
name = "fintwind-quota"
version = "0.1.0"
edition = "2024"
description = "Provider quota adapters, local CLI subscription probes, and SQLite usage index"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6.0"
parking_lot = "0.12"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-width = "0.2.2"
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-env = { path = "../fintwind-env" }
fintwind-http = { path = "../fintwind-http" }
fintwind-protocol = { path = "../fintwind-protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
