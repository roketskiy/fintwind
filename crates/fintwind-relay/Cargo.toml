[package]
name = "fintwind-relay"
version = "0.1.0"
edition = "2024"
description = "Fintwind remote-control relay: identity registry, ciphertext routing, pairing coordination"
license = "GPL-3.0-only"

[[bin]]
name = "fintwind-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossbeam-channel = "0.5"
env_logger = "0.11"
fintwind-remote-crypto = { path = "../fintwind-remote-crypto" }
log = "0.4"
parking_lot = "0.12"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-remote-protocol = { path = "../fintwind-remote-protocol" }
