[package]
name = "fintwind-remote-crypto"
version = "0.1.0"
edition = "2024"
description = "Noise-based end-to-end channel for Fintwind remote control (snow); shared by the host daemon and the PWA via wasm"
license = "GPL-3.0-only"

[dependencies]
ed25519-dalek = "2"
hkdf = "0.12"
rand = "0.8"
sha2 = "0.10"
snow = "0.10"
uuid = { version = "1.18", features = ["v4"] }

# Browser randomness for the wasm build of this same crate. The PWA links
# this crate directly, so both ends share one audited Noise implementation.
# Two getrandom majors ride the tree: 0.2 (snow/rand) uses the `js` feature,
# 0.3 (uuid) uses `wasm_js` plus the `getrandom_backend` cfg flag set for
# the wasm target in .cargo/config.toml.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.18", features = ["js"] }
