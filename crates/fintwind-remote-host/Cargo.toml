[package]
name = "fintwind-remote-host"
version = "0.1.0"
edition = "2024"
description = "Fintwind remote-control host daemon: outbound relay session, operation dedup, approval binding, daemon adapter"
license = "GPL-3.0-only"

[[bin]]
name = "fintwind-remote-host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossbeam-channel = "0.5"
env_logger = "0.11"
fintwind-client = { path = "../fintwind-client" }
fintwind-protocol = { path = "../fintwind-protocol" }
fintwind-remote-crypto = { path = "../fintwind-remote-crypto" }
fintwind-remote-protocol = { path = "../fintwind-remote-protocol" }
log = "0.4"
parking_lot = "0.12"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
] }
