[package]
name = "fintwind-remote-protocol"
version = "0.1.0"
edition = "2024"
description = "Remote-control wire contract: relay-visible frames, sealed end-to-end messages, operations, approvals"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22"
fintwind-protocol = { path = "../fintwind-protocol" }
schemars = { version = "0.8", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
