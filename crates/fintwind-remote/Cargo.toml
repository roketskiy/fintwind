[package]
name = "fintwind-remote"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
async-trait = "0.1"
futures = "0.3"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
# WebRTC.rs 0.21 (MIT/Apache-2.0), the sans-I/O rewrite with a Tokio runtime.
webrtc = { version = "0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
