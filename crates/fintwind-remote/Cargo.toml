[package]
name = "fintwind-remote"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
fintwind-protocol = { path = "../fintwind-protocol" }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
