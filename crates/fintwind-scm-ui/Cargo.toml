[package]
name = "fintwind-scm-ui"
version = "0.1.0"
edition = "2024"
description = "GPUI source-control diff rendering, change tree flattening, and Git commit graph UI"
license = "GPL-3.0-only"

[dependencies]
fintwind-client = { path = "../fintwind-client" }
fintwind-diff = { path = "../fintwind-diff" }
fintwind-git = { path = "../fintwind-git" }
fintwind-markdown = { path = "../fintwind-markdown" }
fintwind-protocol = { path = "../fintwind-protocol" }
fintwind-ui = { path = "../fintwind-ui" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
uuid = { version = "1.18", features = ["v4", "serde"] }
