[package]
name = "fintwind-ssh-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
fintwind-client = { path = "../fintwind-client", features = ["ssh"] }
fintwind-protocol = { path = "../fintwind-protocol" }
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
