[package]
name = "fintwind-ssh-ui"
version = "0.3.4"
edition = "2024"
description = "SSH remote daemon probe, Linux deployment, profile storage, and status UI primitives"
license = "GPL-3.0-only"

[features]
e2e-deploy = []

[dependencies]
anyhow = "1.0"
dirs = "6.0"
fintwind-client = { path = "../fintwind-client", features = ["ssh"] }
fintwind-protocol = { path = "../fintwind-protocol" }
fintwind-ui = { path = "../fintwind-ui" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
