[package]
name = "fintwind-storage"
version = "0.1.0"
edition = "2024"
description = "SQLite task persistence, blob store, attachments, and operation journal"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-protocol = { path = "../fintwind-protocol" }
