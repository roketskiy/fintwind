[package]
name = "fintwind-ui"
version = "0.1.0"
edition = "2024"
description = "Shared GPUI UI primitives, themes, embedded assets, and platform helpers for Fintwind"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
dirs = "6.0"
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "bd014707fd47cd9d0651a9af8c1db6033718a6ea", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-kit = "0.7.1"
parking_lot = "0.12"
fintwind-client = { path = "../fintwind-client" }
fintwind-protocol = { path = "../fintwind-protocol" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }
