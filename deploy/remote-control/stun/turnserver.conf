# Fintwind STUN-only coturn configuration.
#
# This server only answers STUN Binding requests so each peer can discover its
# public address for WebRTC ICE. It is NOT a TURN server: stun-only makes coturn
# ignore every TURN request, and the relay transports are disabled as well. No
# business data or media ever passes through it. Clients use stun:<domain>:18762.

# Plain UDP STUN listener. This is the only transport clients need.
listening-port=18762

# Run as STUN only. All TURN requests (Allocate, Refresh, ChannelBind, Send,
# CreatePermission) are ignored. This is the primary relay disable.
stun-only

# Refuse TCP relay as well. coturn rejects disabling both relay families at
# once; stun-only itself disables all TURN requests, including UDP allocation.
no-tcp-relay

# Do not open TCP, TLS or DTLS listeners. STUN Binding runs over plain UDP only.
no-tcp
no-tls
no-dtls
no-cli

# Disable RFC 5780 NAT behavior discovery. It is not needed for ICE and removes
# an unauthenticated amplification surface.
no-rfc5780

# Refuse peers on multicast/broadcast addresses. Loopback peers are denied by
# default in current coturn; the old no-loopback-peers option is removed.
no-multicast-peers

# Anonymous STUN needs no persistent user database or credentials.
userdb=:memory:

# Keep logs minimal and off stdout. Do not log client addresses or binding
# contents. The service unit further restricts the process.
no-stdout-log
simple-log
log-file=/var/log/fintwind-stun/turnserver.log

# Bind to the host address supplied by the operator. Replace before deployment;
# 0.0.0.0 listens on all interfaces. The public address clients reach is the
# configured domain, not this bind address.
listening-ip=0.0.0.0

# Bound concurrent STUN sessions. STUN-only allocates no relay ports, so no
# relay port range is configured.
total-quota=100
