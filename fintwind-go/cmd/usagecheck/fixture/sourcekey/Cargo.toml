[package]
name = "usagecheck-sourcekey"
version = "0.0.0"
edition = "2021"
publish = false

# Detach from the repository Cargo workspace: this is a test-only fixture
# owned by the Go usagecheck E2E, compiled per-round into the round's own
# target dir. It must never become a member of the product workspace.
[workspace]

[[bin]]
name = "sourcekey"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
