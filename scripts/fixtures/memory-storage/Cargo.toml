[package]
name = "memory-storage-blackbox"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "memory-storage-blackbox"
path = "main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
dirs = "6.0"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
fintwind-protocol = { path = "../../../crates/fintwind-protocol" }
